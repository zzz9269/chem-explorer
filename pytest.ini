[pytest]
testpaths = tests
markers =
    network: needs internet (PubChem, openFDA, RxNorm, ChEMBL…) — skip with -m "not network"
    slow: full-pipeline / whole-app checks (minutes) — skip with -m "not slow"
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*No runtime found.*
    ignore:.*missing ScriptRunContext.*
